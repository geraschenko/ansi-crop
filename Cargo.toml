[package]
name = "ansi-crop"
version = "0.1.0"
authors = ["Anton Geraschenko <geraschenko@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
edition = "2024"
include = ["/src/", "/tests/", "/LICENSE", "/README.md"]
keywords = ["ansi", "terminal", "tmux", "crop", "sgr"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/geraschenko/ansi-crop"
description = "Crop ANSI-styled text (such as tmux capture-pane -e output) to a rectangle while keeping its styling"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ansi-crop"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = ">=4", features = ["derive"], optional = true }
unicode-width = ">=0.2"

[[test]]
name = "cli"
required-features = ["cli"]
